name: CI/CD - Rollback AWS Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The ECR image tag (Git Commit SHA) to roll back to'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REP: emailsaas-backend
  ECR_FRONTEND_REP: emailsaas-frontend

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      # 1. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Log in to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. SSH into EC2 and run the rollback script
      - name: Deploy Target Tag to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,AWS_REGION
          script: |
            # Set target tag
            TARGET_TAG="${{ github.event.inputs.image_tag }}"
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            
            # Login to ECR on remote EC2 instance
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY

            # Stop existing containers if running
            docker stop backend frontend || true
            docker rm backend frontend || true

            # Prune unused images and layers to free up disk space
            docker system prune -a -f --volumes

            # Pull targeted ECR images
            docker pull $REGISTRY/${{ env.ECR_BACKEND_REP }}:$TARGET_TAG
            docker pull $REGISTRY/${{ env.ECR_FRONTEND_REP }}:$TARGET_TAG

            # Tag them as latest locally so they persist as current version
            docker tag $REGISTRY/${{ env.ECR_BACKEND_REP }}:$TARGET_TAG $REGISTRY/${{ env.ECR_BACKEND_REP }}:latest
            docker tag $REGISTRY/${{ env.ECR_FRONTEND_REP }}:$TARGET_TAG $REGISTRY/${{ env.ECR_FRONTEND_REP }}:latest

            # Run Backend container (bonded to Supabase, JWT Secret, and OpenAI)
            docker run -d \
              --name backend \
              --restart always \
              -p 8000:8000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e SMTP_HOST="${{ secrets.SMTP_HOST }}" \
              -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              -e SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}" \
              -e SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
              -e SMTP_USE_TLS="${{ secrets.SMTP_USE_TLS }}" \
              -e NEO4J_URI="${{ secrets.NEO4J_URI }}" \
              -e NEO4J_USER="${{ secrets.NEO4J_USER }}" \
              -e NEO4J_PASSWORD="${{ secrets.NEO4J_PASSWORD }}" \
              $REGISTRY/${{ env.ECR_BACKEND_REP }}:$TARGET_TAG

            # Run Frontend container
            docker run -d \
              --name frontend \
              --restart always \
              -p 8080:80 \
              $REGISTRY/${{ env.ECR_FRONTEND_REP }}:$TARGET_TAG
