name: CI/CD - Deploy to AWS ECR and EC2

on:
  push:
    branches:
      - Main

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REP: emailsaas-backend
  ECR_FRONTEND_REP: emailsaas-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Log in to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build, Tag, and Push Backend Image
      - name: Build and Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_BACKEND_REP }}:$IMAGE_TAG -f backend/Dockerfile backend
          docker push $ECR_REGISTRY/${{ env.ECR_BACKEND_REP }}:$IMAGE_TAG

      # 5. Build, Tag, and Push Frontend Image
      - name: Build and Push Frontend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="/api/v1" \
            -t $ECR_REGISTRY/${{ env.ECR_FRONTEND_REP }}:$IMAGE_TAG \
            -f frontend/Dockerfile frontend
          docker push $ECR_REGISTRY/${{ env.ECR_FRONTEND_REP }}:$IMAGE_TAG

      # 6. Deploy to EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,AWS_REGION
          script: |
            # Login to ECR on remote EC2 instance
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # Stop existing containers if running
            docker stop backend frontend || true
            docker rm backend frontend || true

            # Prune unused images and layers to free up disk space
            docker system prune -a -f --volumes

            # Pull latest ECR images
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REP }}:latest
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REP }}:latest

            # Run Backend container (bonded to Supabase, JWT Secret, and OpenAI)
            docker run -d \
              --name backend \
              --restart always \
              -p 8000:8000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e SMTP_HOST="${{ secrets.SMTP_HOST }}" \
              -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              -e SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}" \
              -e SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
              -e SMTP_USE_TLS="${{ secrets.SMTP_USE_TLS }}" \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REP }}:latest

            # Run Frontend container
            docker run -d \
              --name frontend \
              --restart always \
              -p 8080:80 \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REP }}:latest
